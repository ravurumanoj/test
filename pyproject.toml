[project]
name = "relationship-manager-agentic-rag-poc"
version = "0.1.0"
description = "Backend-only FastAPI POC for a relationship manager agent with portfolio and CRM sub-agents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
	"fastapi>=0.116.0,<1.0.0",
	"pydantic>=2.11.0,<3.0.0",
	"python-dotenv>=1.1.0,<2.0.0",
	"uvicorn>=0.35.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
	"httpx>=0.28.0,<1.0.0",
	"pytest>=8.4.0,<9.0.0",
]
unique = [
	"unique-sdk",
	"unique_toolkit",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
